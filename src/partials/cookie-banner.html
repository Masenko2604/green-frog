<div id="cookie-banner" class="cookie-banner" hidden>
  <div class="cookie-banner__content">

    <div class="cookie-banner__text">
      <h2 class="cookie-banner__title" data-i18n="cookie_title">
        Používáme cookies
      </h2>

      <p class="cookie-banner__description" data-i18n="cookie_description">
        Používáme cookies pro správné fungování webu a pro analýzu návštěvnosti.
        O svém souhlasu můžete kdykoli rozhodnout.
      </p>
    </div>

    <div class="cookie-banner__actions">

      <button type="button" class="cookie-banner__button cookie-banner__button--accept" id="cookie-accept"
        data-i18n="cookie_accept">
        Přijmout
      </button>

      <button type="button" class="cookie-banner__button cookie-banner__button--reject" id="cookie-reject"
        data-i18n="cookie_reject">
        Odmítnout
      </button>

      <button type="button" class="cookie-banner__button cookie-banner__button--settings" id="cookie-settings"
        data-i18n="cookie_settings">
        Nastavení
      </button>

    </div>

  </div>
</div>
