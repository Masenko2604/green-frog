 <script>

  gtag('config', 'G-EMJ6NHFGLW');

  function loadGTM() {
    if (window.gtmLoaded) return;
    window.gtmLoaded = true;
    var script = document.createElement('script');
    script.src = 'https://www.googletagmanager.com/gtag/js?id=G-EMJ6NHFGLW';

  }

  // Запускаем при первом взаимодействии пользователя

    window.addEventListener(evt, loadGTM, { once: true, passive: true });
  });

  // Подстраховка: если пользователь ничего не делает, всё равно загрузить через 4 секунды
